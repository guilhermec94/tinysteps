baseURL: "https://guilhermec94.github.io/tinysteps/"
languageCode: en-us
title: Tiny Steps
theme: ["PaperMod"]
pagination:
  pagerSize: 10

# Taxonomias
taxonomies:
  category: categories
  tag: tags

# Parâmetros PaperMod
params:
  env: production
  description: "Hi, I'm Guilherme — sharing what I learn and love, one small step at a time."
  author: "Guilherme Carvalho"
  defaultTheme: light # light/dark
  showReadingTime: true
  showBreadCrumbs: true
  showPostNavLinks: true
  showCodeCopyButtons: true
  showShareButtons: false
  showPostCategories: true
  disableThemeToggle: true
  DateFormat: "2006.01.02"
  comments: false

  mainSections: ["notes"]

  assets:
    favicon: "favicon.ico"
    favicon32x32: "favicon-32x32.png"
    favicon96x96: "favicon-96x96.png"
    apple_touch_icon: "apple-touch-icon.png"

  homeInfoParams:
    Title: ""
    Content: "Hi, I'm Guilherme — sharing what I learn and love, one small step at a time."
    image: "t-logo.png"
  profileMode:
    enabled: true
    title: "Hi, I'm Guilherme 👋"
    subtitle: "Sharing what I learn and love, one small step at a time."

  socialIcons:
    - name: github
      url: "https://github.com/guilhermec94"

# Menus principais
menu:
  main:
    - name: "Notes"
      url: "notes/"
      weight: 10
    - name: "About"
      url: "about/"
      weight: 20
    - name: "Bookshelf"
      url: "bookshelf/"
      weight: 30
    - name: "Archive"
      url: "archives/"
      weight: 40

# Build
buildDrafts: false
enableRobotsTXT: true
