version: "3"

# Common Hugo task file for the Tiny Steps site.
#
# Usage examples:
#   task test            # verify Hugo works and the site builds
#   task build           # production build into ./public
#   task start           # run the dev server (drafts included) on :1313
#   task start PORT=8080 # run the dev server on another port
#   task clean           # delete generated output
#   task new -- notes/hello/index.md
#   task install         # download Hugo extended into ~/.local/hugo (if missing)

vars:
  # Override per-invocation: task test HUGO=/path/to/hugo
  HUGO: '{{default "hugo" .HUGO}}'
  PORT: '{{default "1313" .PORT}}'
  BASE_URL: '{{default "https://guilhermec94.github.io/tinysteps/" .BASE_URL}}'
  HUGO_VERSION: '{{default "0.151.0" .HUGO_VERSION}}'

tasks:
  default:
    desc: Show available tasks
    silent: true
    cmds:
      - task --list

  test:
    desc: Test that Hugo works and the site builds (production flags)
    cmds:
      - "{{.HUGO}} version"
      - "{{.HUGO}} --gc --minify --baseURL {{.BASE_URL}}"

  build:
    desc: Production build into ./public
    cmds:
      - "{{.HUGO}} --gc --minify --baseURL {{.BASE_URL}}"

  start:
    desc: Start the Hugo dev server with drafts on localhost
    cmds:
      - "{{.HUGO}} server -D --bind 0.0.0.0 --port {{.PORT}}"

  server:
    desc: Alias for start
    cmds:
      - task: start

  clean:
    desc: Remove generated output and build lock
    cmds:
      - rm -rf public .hugo_build.lock

  new:
    desc: Create new content (pass the path after --, e.g. task new -- notes/foo/index.md)
    cmds:
      - "{{.HUGO}} new content {{.CLI_ARGS}}"

  install:
    desc: Download Hugo extended into ~/.local/hugo if not already installed
    env:
      HUGO_VERSION: "{{.HUGO_VERSION}}"
    cmds:
      - |
        set -euo pipefail
        install_dir="${HOME}/.local/hugo"
        if [ -x "${install_dir}/hugo" ]; then
          echo "Hugo already installed at ${install_dir}/hugo"
          exit 0
        fi
        archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
        curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${archive}"
        mkdir -p "${install_dir}"
        tar -C "${install_dir}" -xf "${archive}"
        rm -f "${archive}"
        echo "Installed Hugo ${HUGO_VERSION} at ${install_dir}/hugo"
        echo "Add it to PATH or run: task test HUGO=${install_dir}/hugo"
